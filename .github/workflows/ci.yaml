name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # linux_amd64 tarball
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
      - name: actionlint (workflows)
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: actionlint (composite action steps)
        run: |
          python3 scripts/action_as_workflow.py sbom-dependency-track/action.yml > "$RUNNER_TEMP/action-as-workflow.yaml"
          "$RUNNER_TEMP/actionlint" -color "$RUNNER_TEMP/action-as-workflow.yaml"

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python -m pip install 'pytest==9.1.1'
      - run: python -m pytest -q tests
